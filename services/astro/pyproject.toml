[project]
name = "astro-engine"
version = "0.0.0"
description = "Astro engine: kundli, panchang, dasha, doshas, matching, transits (Phase 1)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_engine"]
