[project]
name = "astro-api"
version = "0.0.0"
description = "Core API: auth, marketplace, wallet, sessions, orders."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  # multipart/form-data for KYC document uploads
  "python-multipart>=0.0.18",
  # Razorpay REST calls (orders, payments, settlements)
  "httpx>=0.28",
  # AES-256-GCM for chat messages at rest
  "cryptography>=44",
  # LiveKit server API: access tokens, webhook verification, room service (voice calls)
  "livekit-api==1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_api"]
