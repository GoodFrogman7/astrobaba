# Local development stack. `make dev` runs this. Values come from .env (see .env.example).
name: astroplatform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astro-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-astro}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astro}:${POSTGRES_PASSWORD:-astro-dev-only}@postgres:5432/${POSTGRES_DB:-astro}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      DOCUMENTS_BACKEND: local
      DOCUMENTS_DIR: /app/uploads
      ASTRO_URL: http://astro:8001
    ports: ["127.0.0.1:8000:8000"]
    volumes: [kycdocs:/app/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  astro:
    build: { context: ., dockerfile: services/astro/Dockerfile }
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/healthz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ASTRO_URL: http://astro:8001
      API_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api: { condition: service_healthy }
      astro: { condition: service_healthy }

  admin:
    build: { context: ., dockerfile: apps/admin/Dockerfile }
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/login"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  kycdocs:
