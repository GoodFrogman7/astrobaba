# Local development stack. `make dev` runs this. Values come from .env (see .env.example).
name: astroplatform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astro-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-astro}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astro}:${POSTGRES_PASSWORD:-astro-dev-only}@postgres:5432/${POSTGRES_DB:-astro}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:3002"]'
      # Development only: Razorpay is simulated (POST /v1/dev/payments/{order}/simulate) and chat
      # messages are encrypted with a key derived from SECRET_KEY. Production refuses both.
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-fake}
      MESSAGES_KEY: ${MESSAGES_KEY:-}
      CLIENT_IP_HEADER: X-Forwarded-For
      # Seconds per billed minute: 60 everywhere real; shorten only to try billing by hand.
      BILLING_MINUTE_SECONDS: ${BILLING_MINUTE_SECONDS:-60}
      METER_TICK_SECONDS: ${METER_TICK_SECONDS:-5}
      # Voice calls (Phase 5): development LiveKit server below.
      FLAG_VOICE_CALLS: ${FLAG_VOICE_CALLS:-true}
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-dev-only-livekit-secret-change-me-0000}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      DOCUMENTS_BACKEND: local
      DOCUMENTS_DIR: /app/uploads
      ASTRO_URL: http://astro:8001
    ports: ["127.0.0.1:8000:8000"]
    volumes: [kycdocs:/app/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Development LiveKit SFU for in-app voice calls (ADR-0008). Audio goes browser <-> LiveKit;
  # webhooks (participant joined/left) go to the API. Production uses a managed or separately
  # deployed LiveKit with its own keys and a wss:// URL.
  livekit:
    image: livekit/livekit-server:v1.9.1
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-dev-only-livekit-secret-change-me-0000}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50020
          use_external_ip: false
          node_ip: 127.0.0.1
        webhook:
          api_key: ${LIVEKIT_API_KEY:-devkey}
          urls: ["http://api:8000/v1/calls/livekit/webhook"]
        room:
          # Only the API creates rooms, so a still-valid token cannot reopen an ended call.
          auto_create: false
          empty_timeout: 60
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50020:50000-50020/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7880/"]
      interval: 5s
      timeout: 3s
      retries: 20

  astro:
    build: { context: ., dockerfile: services/astro/Dockerfile }
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/healthz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ASTRO_URL: http://astro:8001
      API_URL: http://api:8000
      # The browser's chat socket goes straight to the API (read at request time).
      API_WS_URL: ws://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api: { condition: service_healthy }
      astro: { condition: service_healthy }

  admin:
    build: { context: ., dockerfile: apps/admin/Dockerfile }
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/login"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api: { condition: service_healthy }

  astrologer:
    build: { context: ., dockerfile: apps/astrologer/Dockerfile }
    environment:
      API_URL: http://api:8000
      API_WS_URL: ws://localhost:8000
      PUBLIC_SITE_URL: http://localhost:3000
    ports: ["127.0.0.1:3002:3002"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/login"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  kycdocs:
