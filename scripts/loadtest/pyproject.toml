[project]
name = "astro-loadtest"
version = "0.0.0"
description = "Dev tool: synthetic chat-session load test (docs/api/growth.md §6). Never for production."
requires-python = ">=3.12"
dependencies = [
  "astro-api",
  "httpx>=0.28",
  "websockets>=14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loadtest"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["astro_api", "astro_engine", "astro_worker", "loadtest"]
