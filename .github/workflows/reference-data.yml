name: Golden reference data

# Fetches independent reference values (JPL Horizons, USNO) for evals/astro and commits them.
# Runs when the fixture inputs or the fetch script change, or on demand.
on:
  push:
    paths:
      - evals/astro/fixtures/**
      - evals/astro/scripts/**
      - .github/workflows/reference-data.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python evals/astro/scripts/fetch_reference.py
      - name: Commit reference data if it changed
        run: |
          # Only the retrieval timestamp changes when values are identical; ignore that.
          if git diff --quiet -I '"retrieved_at"' -- evals/astro/reference; then
            echo "reference data unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/astro/reference
          git commit -m "evals: refresh golden reference data (JPL Horizons, USNO)"
          git push
