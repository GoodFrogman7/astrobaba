# uv workspace for the Python services. Each service is its own package; shared dev tools live here.
[project]
name = "astroplatform-dev"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false
# Only resolve releases at least two weeks old at lock time (bump deliberately).
exclude-newer = "2026-10-06T00:00:00Z"

[tool.uv.workspace]
members = ["services/api", "services/astro", "services/worker", "scripts/loadtest"]

[tool.uv.sources]
astro-api = { workspace = true }
astro-engine = { workspace = true }
astro-worker = { workspace = true }
astro-loadtest = { workspace = true }

[dependency-groups]
dev = [
  "astro-api",
  "astro-engine",
  "astro-worker",
  "astro-loadtest",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  # eval harness only: independent ascendant check and fixture files
  "skyfield>=1.49",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["astro_api", "astro_engine", "astro_worker"]

[tool.ruff.lint.per-file-ignores]
"services/*/tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Each service has a tests/conftest.py; name modules by path so they do not collide.
explicit_package_bases = true
mypy_path = ["services/api/src", "services/astro/src", "services/worker/src", "scripts/loadtest/src"]
files = ["services/api/src", "services/astro/src", "services/worker/src", "services/api/tests", "services/astro/tests", "services/worker/tests", "evals/astro", "evals/safety", "scripts/loadtest/src", "scripts/loadtest/tests"]

[[tool.mypy.overrides]]
module = ["swisseph", "geonamescache", "skyfield.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services/api/tests", "services/astro/tests", "services/worker/tests", "evals/astro", "evals/safety"]
markers = ["integration: needs Postgres and Redis (set DATABASE_URL and REDIS_URL)"]
addopts = "--import-mode=importlib"
