# Golden panchang fixtures (PROPOSAL, Phase 1 fills `expected`).
#
# 34 date × place rows. Expected values are transcribed from published almanacs and public
# astronomical services (sources in README.md). Never typed from memory or produced by an LLM.
# Each value records its source; rows where two almanacs disagree are kept and marked, because
# disagreement usually means a convention difference we must document.
#
# Per row Phase 1 records, all as UTC instants plus the place's IANA zone:
#   sunrise, sunset                      tolerance ±1 min (USNO convention: upper limb, 34' refraction)
#   tithi_at_sunrise + tithi_end         tolerance ±2 min on the end time
#   nakshatra_at_sunrise + nakshatra_end tolerance ±2 min on the end time
#   rahu_kaal_start, rahu_kaal_end       tolerance ±1 min given our own sunrise/sunset; slot must match the weekday table
#   vaara (weekday by sunrise, not midnight)

schema_version: 1

places:
  delhi:   { name: New Delhi, lat: 28.6139, lon: 77.2090, tz: Asia/Kolkata }
  mumbai:  { name: Mumbai,    lat: 19.0760, lon: 72.8777, tz: Asia/Kolkata }
  chennai: { name: Chennai,   lat: 13.0827, lon: 80.2707, tz: Asia/Kolkata }
