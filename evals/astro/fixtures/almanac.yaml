  - { id: A34, criterion: "a nakshatra ending within 5 minutes after sunrise, any India place, 2026", expected: {} }

# Static rule, not an engine output: the 8 equal parts of daytime and the Rahu Kaal part per weekday.
rahu_kaal_slot_by_weekday: { Mon: 2, Tue: 7, Wed: 5, Thu: 6, Fri: 4, Sat: 3, Sun: 8 }
