  - { id: A15, date: "2025-12-21", place: mumbai,  why: "west India, latest sunrise in IST", expected: {} }

  # Widely published festival dates (verify each label against the almanac when transcribing).
  - { id: A16, date: "2025-03-14", place: delhi,   why: "Holi (Purnima region)", expected: {} }
  - { id: A17, date: "2025-07-10", place: ujjain,  why: "Guru Purnima", expected: {} }
