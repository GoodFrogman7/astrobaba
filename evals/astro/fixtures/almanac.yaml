# Golden panchang fixtures: inputs only.
#
# 34 date x place rows. Reference data (US Naval Observatory sunrise/sunset, JPL Horizons Sun and
# Moon series) is fetched by scripts/fetch_reference.py into ../reference/almanac.json with
# provenance; test_golden.py derives and compares, all as UTC instants plus the place's zone:
#   sunrise, sunset         ±1 min (USNO convention: upper limb, standard refraction)
#   tithi, nakshatra ends   ±2 min (solved from the Horizons series)
#   Rahu Kaal               ±1 min, from the USNO day and the weekday table
#   vaara                   weekday of the local date

schema_version: 1

places:
  delhi:   { name: New Delhi, lat: 28.6139, lon: 77.2090, tz: Asia/Kolkata }
  mumbai:  { name: Mumbai,    lat: 19.0760, lon: 72.8777, tz: Asia/Kolkata }
  chennai: { name: Chennai,   lat: 13.0827, lon: 80.2707, tz: Asia/Kolkata }
  kolkata: { name: Kolkata,   lat: 22.5726, lon: 88.3639, tz: Asia/Kolkata }
  ujjain:  { name: Ujjain,    lat: 23.1765, lon: 75.7885, tz: Asia/Kolkata }
  london:  { name: London,    lat: 51.5074, lon: -0.1278, tz: Europe/London }

rows:
  # Weekday sweep: one full week in Delhi, covers every Rahu Kaal slot.
  - { id: A01, date: "2026-01-05", place: delhi, why: "Monday, Rahu Kaal slot 2" }
  - { id: A02, date: "2026-01-06", place: delhi, why: "Tuesday, slot 7" }
  - { id: A03, date: "2026-01-07", place: delhi, why: "Wednesday, slot 5" }
  - { id: A04, date: "2026-01-08", place: delhi, why: "Thursday, slot 6" }
  - { id: A05, date: "2026-01-09", place: delhi, why: "Friday, slot 4" }
  - { id: A06, date: "2026-01-10", place: delhi, why: "Saturday, slot 3" }
  - { id: A07, date: "2026-01-11", place: delhi, why: "Sunday, slot 8" }

  # Same week in Chennai: lower latitude, different day length.
  - { id: A08, date: "2026-01-05", place: chennai, why: "latitude contrast with A01" }
  - { id: A09, date: "2026-01-08", place: chennai, why: "latitude contrast with A04" }

  # Solstices and equinoxes 2025 (day length extremes).
  - { id: A10, date: "2025-03-20", place: delhi,   why: "March equinox" }
  - { id: A11, date: "2025-06-21", place: delhi,   why: "June solstice, longest day" }
  - { id: A12, date: "2025-09-22", place: delhi,   why: "September equinox" }
  - { id: A13, date: "2025-12-21", place: delhi,   why: "December solstice, shortest day" }
  - { id: A14, date: "2025-06-21", place: kolkata, why: "east India, earliest sunrise in IST" }
  - { id: A15, date: "2025-12-21", place: mumbai,  why: "west India, latest sunrise in IST" }

  # Widely published festival dates (verify each label against the almanac when transcribing).
  - { id: A16, date: "2025-03-14", place: delhi,   why: "Holi (Purnima region)" }
  - { id: A17, date: "2025-07-10", place: ujjain,  why: "Guru Purnima" }
  - { id: A18, date: "2025-08-16", place: mumbai,  why: "Janmashtami (Ashtami / Rohini)" }
  - { id: A19, date: "2025-08-27", place: mumbai,  why: "Ganesh Chaturthi" }
  - { id: A20, date: "2025-09-22", place: kolkata, why: "Navratri begins (Pratipada)" }
  - { id: A21, date: "2025-10-02", place: delhi,   why: "Dussehra (Dashami)" }
  - { id: A22, date: "2025-10-20", place: delhi,   why: "Diwali (Amavasya)" }
  - { id: A23, date: "2026-01-14", place: ujjain,  why: "Makar Sankranti (Sun enters sidereal Capricorn)" }
  - { id: A24, date: "2026-02-15", place: chennai, why: "Maha Shivaratri (Chaturdashi)" }

  # Adhik (intercalary) month 2026: first and last day as published.
  - { id: A25, date: "2026-05-17", place: delhi, why: "start of adhik masa (masa naming is Phase 2; checks sunrise, tithi, nakshatra here)" }
  - { id: A26, date: "2026-06-15", place: delhi, why: "end of adhik masa (masa naming is Phase 2; checks sunrise, tithi, nakshatra here)" }

  # Today/tomorrow pair: the teardown's "tomorrow shows today" bug.
  - { id: A27, date: "2026-10-20", place: delhi, why: "today page" }
  - { id: A28, date: "2026-10-21", place: delhi, why: "tomorrow page must differ from A27" }

  # Leap day.
  - { id: A29, date: "2024-02-29", place: kolkata, why: "leap day" }

  # Non-India place: different zone and DST.
  - { id: A30, date: "2025-03-30", place: london, why: "DST starts; sunrise in BST" }
  - { id: A31, date: "2025-06-21", place: london, why: "high-latitude long day" }

  # Edge cases. Dates were found by scanning with the engine (it only picks where to look);
  # the expected values still come from the independent references.
  - { id: A32, date: "2025-02-02", place: delhi, why: "kshaya tithi: one tithi starts and ends between two sunrises" }
  - { id: A33, date: "2025-02-18", place: delhi, why: "vriddhi tithi: the sunrise tithi is still current at the next sunrise" }
  - { id: A34, date: "2026-11-21", place: delhi, why: "nakshatra ends within 5 minutes after sunrise" }

# Static rule, not an engine output: the 8 equal parts of daytime and the Rahu Kaal part per weekday.
rahu_kaal_slot_by_weekday: { Mon: 2, Tue: 7, Wed: 5, Thu: 6, Fri: 4, Sat: 3, Sun: 8 }
