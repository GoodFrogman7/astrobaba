  - { id: A05, date: "2026-01-09", place: delhi, why: "Friday, slot 4", expected: {} }
  - { id: A06, date: "2026-01-10", place: delhi, why: "Saturday, slot 3", expected: {} }
  - { id: A07, date: "2026-01-11", place: delhi, why: "Sunday, slot 8", expected: {} }

  # Same week in Chennai: lower latitude, different day length.
