# Money questions from the client: delivered in chat, refused by the AI (points to a registered
# adviser). Investment, loan and betting instructions from the astrologer break the conduct rules
# (conduct.json financial_advice) but are not among the automatic refusal reasons (chat.ts
# BLOCK_REASONS): they are delivered and handled through client reports. These cases pin that.
cases:
