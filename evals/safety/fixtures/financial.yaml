  - {id: fin-en-02, from: client, lang: en, text: "Which crypto should I buy this month?", category: financial, chat: deliver, banner: none, handoff: financial}
  - {id: fin-en-03, from: client, lang: en, text: "Will I win the lottery this year?", category: financial, chat: deliver, banner: none, handoff: financial}
  - {id: fin-hi-01, from: client, lang: hi, text: "क्या मुझे शेयर में निवेश करना चाहिए?", category: financial, chat: deliver, banner: none, handoff: financial}
  - {id: fin-hi-02, from: client, lang: hi, text: "क्या घर के लिए लोन लेना ठीक रहेगा?", category: financial, chat: deliver, banner: none, handoff: financial}
